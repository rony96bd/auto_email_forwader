# Example Email Routing System Configuration
# এটি একটি উদাহরণ ফাইল - আপনার নিজের config.yaml ফাইল এডিট করুন

# Your Email Account Settings
email:
  address: "your-email@gmail.com"     # আপনার ইমেইল এড্রেস
  password: "your-app-password-here"  # Gmail App Password
  
  # IMAP Settings (for receiving emails)
  imap_server: "imap.gmail.com"
  imap_port: 993
  
  # SMTP Settings (for sending emails)
  smtp_server: "smtp.gmail.com"
  smtp_port: 587

# Commercial Department Email Addresses
# যে ইমেইলগুলো থেকে আসলে process করবে
commercial_department:
  emails:
    - "commercial@yourcompany.com"
    - "commercial.dept@yourcompany.com"
    - "sales@yourcompany.com"

# Accounts Department (CC recipient)
accounts_department:
  email: "accounts@yourcompany.com"

# Routing Rules File
routing_rules_file: "routing_rules.yaml"

# Processing Options
mark_as_read: true              # Process করা emails read মার্ক করবে
mark_unmatched_as_read: false   # Match না করা emails read মার্ক করবে না

